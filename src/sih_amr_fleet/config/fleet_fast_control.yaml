/**:
  controller_manager:
    ros__parameters:
      # 100 Hz is sufficient for the simulated drivetrain and avoids
      # overwhelming DDS with a 1 kHz multi-robot control stream.
      update_rate: 100
      hold_joints: true
      position_proportional_gain: 20.0

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      diffdrive_controller:
        type: diff_drive_controller/DiffDriveController

  diffdrive_controller:
    ros__parameters:
      use_sim_time: true
      left_wheel_names: ["left_wheel_joint"]
      right_wheel_names: ["right_wheel_joint"]
      wheel_separation: 0.233
      wheel_radius: 0.03575
      wheel_separation_multiplier: 1.0
      left_wheel_radius_multiplier: 1.0
      right_wheel_radius_multiplier: 1.0
      publish_rate: 30.0
      odom_frame_id: odom
      base_frame_id: base_link
      pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
      open_loop: false
      enable_odom_tf: true
      cmd_vel_timeout: 0.5
      # The project-owned twist_stamper publishes TwistStamped at
      # ~/cmd_vel.  The unstamped mode instead listens on cmd_vel_unstamped
      # and leaves the controller command contract disconnected.
      use_stamped_vel: true
      preserve_turning_radius: true
      # These high-rate diagnostics are unused by the fleet.  Suppressing
      # them reduces four-robot DDS pressure without affecting odometry.
      publish_cmd: false
      publish_wheel_data: false

      # Gazebo-only baseline limits.  Never use this profile on physical AMRs.
      linear.x.has_velocity_limits: true
      linear.x.has_acceleration_limits: true
      linear.x.max_velocity: 6.0
      linear.x.min_velocity: -6.0
      linear.x.max_acceleration: 6.0

      angular.z.has_velocity_limits: true
      angular.z.has_acceleration_limits: true
      angular.z.max_velocity: 1.90
      angular.z.min_velocity: -1.90
      angular.z.max_acceleration: 7.725
      angular.z.min_acceleration: -7.725
